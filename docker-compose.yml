services:
  serenedb:
    # Pinned multi-arch release: Docker pulls the native amd64 or arm64 build.
    # Don't use :latest, 26.10.1 was published for amd64 only.
    image: serenedb/serenedb:${SERENEDB_TAG:-26.09.1.3}
    restart: on-failure
    stop_grace_period: 5s
    environment:
      SERENEDB_HOST_AUTH_METHOD: trust
    ports:
      - "${SERENEDB_PORT:-7890}:7890"
    volumes:
      - serenedb-data:/var/lib/serenedb
      # Raw logs and the ownership table, readable from SQL as /data/...
      - ./data:/data:ro

  serene-ui:
    image: serenedb/serene-ui:${SERENE_UI_TAG:-26.05.1}
    restart: on-failure
    stop_grace_period: 5s
    stop_signal: SIGINT
    ports:
      - "${SERENE_UI_PORT:-6543}:6543"
    environment:
      DEFAULT_CONNECTION_NAME: local
      DEFAULT_CONNECTION_STRING: postgres://postgres@serenedb:7890/postgres
    depends_on:
      - serenedb

  psql:
    image: alpine/psql:latest
    profiles: ["tools"]
    entrypoint: ["psql", "-h", "serenedb", "-p", "7890", "-U", "postgres", "-v", "ON_ERROR_STOP=1"]
    volumes:
      - ./sql:/sql:ro

volumes:
  serenedb-data:
