services:
  mcp-server:
    build:
      context: .
    init: true
    restart: unless-stopped
    environment:
      SERENEDB_DSN: ${SERENEDB_DOCKER_DSN:-}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_PATH: /mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${MCP_PUBLISH_HOST:-127.0.0.1}:${MCP_PUBLISHED_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3);
          body = json.load(response);
          assert response.status == 200 and body['status'] == 'ok'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
