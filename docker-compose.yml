name: ${COMPOSE_PROJECT_NAME:-schubki-integration}

services:
  serenedb:
    image: serenedb/serenedb:${SERENEDB_TAG:-26.09.1.3}
    restart: on-failure
    stop_grace_period: 5s
    environment:
      SERENEDB_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${SERENEDB_PORT:-17890}:7890"
    volumes:
      - serenedb-data:/var/lib/serenedb
      - ./data:/data:ro

  mcp-server:
    build:
      context: .
    init: true
    restart: unless-stopped
    environment:
      # Trust-authenticated isolated development DB; never publish this network.
      SERENEDB_DSN: ${SERENEDB_DOCKER_DSN:-host=serenedb port=7890 dbname=postgres user=postgres connect_timeout=5}
      MCP_DATASET_BACKEND: ${MCP_DATASET_BACKEND:-sql}
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_PATH: /mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - serenedb
    ports:
      - "127.0.0.1:${MCP_PUBLISHED_PORT:-18000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          response = urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3);
          assert response.status == 200 and json.load(response)['status'] == 'ok'
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  serene-ui:
    image: serenedb/serene-ui:${SERENE_UI_TAG:-26.05.1}
    profiles: ["ui"]
    restart: on-failure
    stop_grace_period: 5s
    stop_signal: SIGINT
    ports:
      - "127.0.0.1:${SERENE_UI_PORT:-16543}:6543"
    environment:
      DEFAULT_CONNECTION_NAME: integration
      DEFAULT_CONNECTION_STRING: postgres://postgres@serenedb:7890/postgres
    depends_on:
      - serenedb

  psql:
    image: postgres:17-alpine
    profiles: ["tools"]
    entrypoint: ["psql", "-h", "serenedb", "-p", "7890", "-U", "postgres", "-d", "postgres", "-v", "ON_ERROR_STOP=1"]
    volumes:
      - ./sql:/sql:ro

volumes:
  # Compose prefixes this with schubki-integration; no external or fixed-name volume.
  serenedb-data:
